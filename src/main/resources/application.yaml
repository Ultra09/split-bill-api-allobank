server:
  port: 4110

spring:
  application:
    name: split-bill-api
  datasource:
    url: jdbc:h2:mem:split_bill_db
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true